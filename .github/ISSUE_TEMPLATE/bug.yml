name: Bug report
description: Report a reproducible Lossy problem using synthetic data only
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach real drafts, clipboard contents, databases, contact names, URLs, window titles, file paths, or encryption keys.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
      placeholder: Describe the behavior using synthetic example text.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest repeatable sequence.
      placeholder: |
        1. Open a supported test editor
        2. Type synthetic text
        3. Switch context
        4. Observe...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lossy version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Capture
        - Context separation
        - Clipboard
        - Storage or recovery
        - Privacy or security
        - Interface
        - Installer or startup
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed all real captured content and sensitive metadata from this report.
          required: true

