name: Feature request
description: Propose a focused improvement to Lossy
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem should Lossy address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful behavior.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and failure considerations
      description: Could this expose, misclassify, lose, or duplicate captured content?
    validations:
      required: true

