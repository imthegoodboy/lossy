name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install required Rust components
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.88.0

      - name: Build desktop frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - name: Check companion JavaScript
        run: |
          node --check integrations/browser/content.js
          node --check integrations/browser/worker.js
          node --check integrations/browser/popup.js

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Package Windows installer
        working-directory: apps/desktop
        env:
          CARGO_BUILD_JOBS: 2
        run: npm run tauri -- build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: lossy-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

